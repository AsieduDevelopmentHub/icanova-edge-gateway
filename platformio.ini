; iCaNova Edge Gateway — Modbus RTU multi-board (ESP32-C3 + 5V Arduino isolation benches)
; DSE 73xx equipment support remains. Soft-AP prefix: ICANOVA-EDGE (see doc/product/).
;
; Build / upload examples:
;   pio run -e esp32-c3-supermini
;   pio run -e mega2560 -t upload --upload-port COMx
;   pio run -e uno -t upload --upload-port COMx
;   pio device monitor -e mega2560 --port COMx

[common]
monitor_speed = 115200
monitor_echo = no
build_flags = -Isrc

; ---------------------------------------------------------------------------
; ESP32-C3 SuperMini (native USB CDC) — production target
; ---------------------------------------------------------------------------
[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = 921600
board_build.mcu = esp32c3
board_build.f_cpu = 160000000L
board_build.flash_mode = qio
board_build.partitions = partitions/c3.csv
board_build.cdc_on_boot = 1
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
monitor_echo = ${common.monitor_echo}
build_flags =
  ${common.build_flags}
  -DBOARD_PROFILE_ESP32C3
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; Arduino Mega 2560 — RECOMMENDED 5V isolation bench
; RS485 on Serial1: RX=19, TX=18, DE/RE=2; MAX485 VCC → 5V
; Full DSE named map + SCF (strings in PROGMEM / flash).
; ---------------------------------------------------------------------------
[env:mega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = ${common.monitor_speed}
monitor_echo = ${common.monitor_echo}
build_flags =
  ${common.build_flags}
  -DBOARD_PROFILE_MEGA
lib_ignore = SoftwareSerial
build_src_filter =
  +<*>
  -<net/>
  -<telemetry/>

; ---------------------------------------------------------------------------
; Arduino Uno — 5V isolation (SoftwareSerial D10=RX, D11=TX, DE/RE=D2)
; Prefer Mega if available (true HW UART for RS485 + full DSE map).
; ATmega328 cannot fit the named map (~47KB flash / ~3KB RAM needed).
; GATEWAY_LITE keeps Modbus diagnostics (crc-test/rawread/rs485raw).
; ---------------------------------------------------------------------------
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = ${common.monitor_speed}
monitor_echo = ${common.monitor_echo}
build_flags =
  ${common.build_flags}
  -DBOARD_PROFILE_UNO
  -DGATEWAY_LITE
build_src_filter =
  +<*>
  -<devices/dse7320_registers.cpp>
  -<devices/dse_scf.cpp>
  -<net/>
  -<telemetry/>

; ---------------------------------------------------------------------------
; Arduino Nano (ATmega328) — same pins as Uno SoftwareSerial profile
; ---------------------------------------------------------------------------
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = ${common.monitor_speed}
monitor_echo = ${common.monitor_echo}
build_flags =
  ${common.build_flags}
  -DBOARD_PROFILE_NANO
  -DGATEWAY_LITE
build_src_filter =
  +<*>
  -<devices/dse7320_registers.cpp>
  -<devices/dse_scf.cpp>
  -<net/>
  -<telemetry/>
